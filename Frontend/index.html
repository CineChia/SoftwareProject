<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Safe Route — Malabon &amp; Caloocan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --paper: #f4efe4;
    --paper-dark: #e8e0cf;
    --ink: #2c2a24;
    --ink-soft: #6b6558;
    --line: rgba(44,42,36,0.14);
    --olive: #4f6a4a;
    --olive-dark: #384c35;
    --amber: #d9a441;
    --clay: #c1613f;
    --card-shadow: 0 18px 40px -18px rgba(44,42,36,0.35), 0 2px 8px rgba(44,42,36,0.08);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    color: var(--ink);
    background: var(--paper-dark);
    overflow: hidden;
  }

  #map {
    position: absolute;
    inset: 0;
    filter: sepia(18%) saturate(85%) brightness(1.03) contrast(0.97);
  }

  /* subtle paper grain overlay on top of the map */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 400;
    background-image: radial-gradient(rgba(44,42,36,0.045) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: multiply;
    opacity: 0.5;
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 401;
    box-shadow: inset 0 0 140px rgba(44,42,36,0.28);
  }

  /* ---------- Route Panel ---------- */
  .panel {
    position: absolute;
    top: 24px;
    left: 24px;
    width: 340px;
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    border: 1px solid var(--line);
    padding: 20px 20px 16px;
    z-index: 500;
    font-size: 14px;
  }

  .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0 0 2px;
  }

  .panel h1 {
    font-size: 20px;
    margin: 0 0 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    margin-bottom: 10px;
  }

  .field:focus-within {
    border-color: var(--olive);
    box-shadow: 0 0 0 3px rgba(79,106,74,0.15);
  }

  .field .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .field.origin .dot { background: var(--olive); }
  .field.dest .dot { background: var(--clay); }

  .field input {
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    flex: 1;
    min-width: 0;
  }
  .field input::placeholder { color: #b3ab98; }

  .field .icon-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px;
    flex-shrink: 0;
  }
  .field .icon-btn:hover { color: var(--ink); }

  .modes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 14px 0 14px;
  }

  .mode-btn {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 4px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    transition: all 0.15s ease;
  }

  .mode-btn svg { width: 18px; height: 18px; }

  .mode-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .mode-btn:not(.active):hover { border-color: var(--ink-soft); }

  .find-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 13px;
    background: var(--olive);
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .find-btn:hover { background: var(--olive-dark); }
  .find-btn:active { transform: translateY(1px); }

  .result {
    margin-top: 12px;
    background: #fbf6ea;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
    display: none;
  }
  .result.show { display: block; }

  .result-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    color: #9a5a1f;
  }
  .result-title svg { flex-shrink: 0; }

  .result-meta {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  /* ---------- My Location button ---------- */
  .my-location {
    position: absolute;
    top: 24px;
    right: 24px;
    z-index: 500;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 11px 18px;
    box-shadow: var(--card-shadow);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: var(--ink);
  }
  .my-location:hover { background: #fff; }

  /* ---------- Bottom-left compass label ---------- */
  .layers-toggle {
    position: absolute;
    bottom: 24px;
    left: 24px;
    z-index: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px 8px 8px;
    box-shadow: var(--card-shadow);
    cursor: pointer;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .compass {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ---------- Legend ---------- */
  .legend {
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 500;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    padding: 14px 18px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .legend-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .legend-rows { display: flex; gap: 16px; }
  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
  .legend-swatch { width: 11px; height: 11px; border-radius: 50%; }
  .swatch-low { background: #6a9a5c; }
  .swatch-med { background: #d9a441; }
  .swatch-high { background: #c1613f; }

  @media (max-width: 640px) {
    .panel { width: calc(100% - 32px); left: 16px; top: 16px; }
    .my-location { top: 16px; right: 16px; padding: 9px 14px; font-size: 12px; }
    .legend { right: 16px; bottom: 16px; padding: 10px 14px; }
    .layers-toggle { left: 16px; bottom: 16px; }
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="grain"></div>
<div class="vignette"></div>

<!-- Route planning panel -->
<div class="panel">
  <p class="eyebrow">Plan a route</p>
  <h1>Malabon &amp; Caloocan</h1>

  <div class="field origin">
    <span class="dot"></span>
    <input type="text" value="University of the East, U. E. Tech Road" />
    <button class="icon-btn" title="Use current location">◎</button>
    <button class="icon-btn" title="Clear">✕</button>
  </div>

  <div class="field dest">
    <span class="dot"></span>
    <input type="text" value="Malabon, Northern Manila District, Metro" />
    <button class="icon-btn" title="Clear">✕</button>
  </div>

  <div class="modes">
    <button class="mode-btn" data-mode="walk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="13" cy="4" r="1.6"/><path d="M15 8l-3 2-1 5-3 5m4-10l3 3 3 1m-6-4l-1 4 4 3"/></svg>
      Walk / Run
    </button>
    <button class="mode-btn" data-mode="bike">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="17" r="3.2"/><circle cx="18" cy="17" r="3.2"/><path d="M6 17l4-9h4l3 6M10 8h3m-7 9h8l3-6"/></svg>
      Bicycle
    </button>
    <button class="mode-btn active" data-mode="car">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16v-3l2-5h12l2 5v3"/><rect x="3" y="16" width="18" height="3" rx="1"/><circle cx="7.5" cy="19.2" r="1.3"/><circle cx="16.5" cy="19.2" r="1.3"/></svg>
      Car
    </button>
  </div>

  <button class="find-btn" id="findRouteBtn">Find the safest route</button>

  <div class="result" id="resultCard">
    <div class="result-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 16H3z"/><path d="M12 9v4"/><circle cx="12" cy="16.5" r="0.6" fill="currentColor"/></svg>
      Passes through some flood-prone areas
    </div>
    <div class="result-meta">3.0 km · about 6 min</div>
  </div>
</div>

<!-- My location -->
<div class="my-location" id="myLocationBtn">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
  My location
</div>

<!-- Layers toggle -->
<div class="layers-toggle">
  <span class="compass">N</span>
  Isometric paper layers
</div>

<!-- Flood depth legend (labels only, no overlay data) -->
<div class="legend">
  <div class="legend-title">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c-3 4-6 7.5-6 11a6 6 0 0012 0c0-3.5-3-7-6-11z"/></svg>
    Flood depth
  </div>
  <div class="legend-rows">
    <div class="legend-row"><span class="legend-swatch swatch-low"></span>Low</div>
    <div class="legend-row"><span class="legend-swatch swatch-med"></span>Medium</div>
    <div class="legend-row"><span class="legend-swatch swatch-high"></span>High</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  // Base map centered on Malabon / Caloocan, Metro Manila
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: true
  }).setView([14.6620, 120.9820], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).remove; // keep default corner clear for legend
  L.control.zoom({ position: 'topright' }).addTo(map);

  const origin = [14.6570, 120.9850];
  const destination = [14.6605, 121.0000];

  const originMarker = L.circleMarker(origin, {
    radius: 7, color: '#384c35', weight: 2, fillColor: '#4f6a4a', fillOpacity: 1
  }).addTo(map).bindPopup('University of the East');

  const destMarker = L.circleMarker(destination, {
    radius: 7, color: '#8a3b22', weight: 2, fillColor: '#c1613f', fillOpacity: 1
  }).addTo(map).bindPopup('Malabon City Hall');

  let routeLine = null;

  function drawRoute() {
    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline([origin, [14.659, 120.992], destination], {
      color: '#8a3b22',
      weight: 5,
      opacity: 0.9,
      lineCap: 'round'
    }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [80, 80] });
    document.getElementById('resultCard').classList.add('show');
  }

  document.getElementById('findRouteBtn').addEventListener('click', drawRoute);

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.getElementById('myLocationBtn').addEventListener('click', () => {
    map.setView(origin, 15);
  });
</script>

</body>
</html>
